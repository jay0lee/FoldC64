<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#40318d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Commodore 64 emulator for Samsung Galaxy Z Fold">

  <title>FoldC64</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/monitor.css">
  <link rel="stylesheet" href="./css/keyboard.css">
  <link rel="stylesheet" href="./css/joystick.css">
</head>
<body>
  <div class="app-container" id="app">

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- TOP HALF: C64 Monitor / CRT Screen                         -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <section id="monitor">
      <div id="c64-screen" class="retro-mode">
        <canvas id="c64-canvas"></canvas>
      </div>
    </section>

    <!-- Hinge gap (only visible in folded posture) -->
    <div id="hinge-gap" aria-hidden="true"></div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- BOTTOM HALF: Controls Panel (Keyboard / Joystick)          -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <section id="controls-panel">
      <!-- Toolbar -->
      <div id="controls-toolbar">
        <button id="btn-menu" class="toolbar-btn" title="Menu" aria-label="Menu">☰</button>
        <div id="slide-indicator">
          <span class="dot active" data-panel="keyboard"></span>
          <span class="dot" data-panel="joystick"></span>
        </div>
        <button id="btn-display-mode" class="toolbar-btn" title="Toggle CRT/Clean display" aria-label="Toggle display mode">📺</button>
        <button id="btn-fullscreen-toolbar" class="toolbar-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">⛶</button>
      </div>

      <!-- Sliding panels container -->
      <div class="controls-slider" id="controls-slider">
        <!-- Panel 1: C64 Keyboard -->
        <div class="keyboard-view" id="keyboard-container">
          <!-- Generated by js/keyboard.js -->
        </div>

        <!-- Panel 2: Virtual Joystick -->
        <div class="joystick-view" id="joystick-container">
          <!-- Generated by js/joystick.js -->
        </div>
      </div>
    </section>
  </div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Settings / Menu Overlay                                     -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div id="settings-overlay" class="overlay hidden" aria-hidden="true">
    <div class="overlay-backdrop"></div>
    <div class="overlay-panel">
      <h2 class="overlay-title">FoldC64 Settings</h2>

      <div class="setting-group">
        <h3>Display</h3>
        <label class="setting-row">
          <span>CRT Mode</span>
          <select id="setting-display-mode">
            <option value="retro">Retro (Scanlines)</option>
            <option value="clean">Clean (Pixel-Perfect)</option>
          </select>
        </label>
      </div>

      <div class="setting-group">
        <h3>Audio</h3>
        <label class="setting-row">
          <span>Volume</span>
          <input type="range" id="setting-volume" min="0" max="100" value="80">
        </label>
      </div>

      <div class="setting-group">
        <h3>Files</h3>
        <button id="btn-load-rom" class="menu-btn">📂 Load Program (.prg / .d64 / .t64)</button>
      </div>

      <div class="setting-group">
        <h3>Save States</h3>
        <button id="btn-save-state" class="menu-btn">💾 Save State</button>
        <button id="btn-load-state" class="menu-btn">📁 Load State</button>
      </div>

      <div class="setting-group">
        <h3>Emulator</h3>
        <button id="btn-fullscreen" class="menu-btn">⛶ Toggle Fullscreen</button>
        <button id="btn-reset" class="menu-btn">🔄 Reset C64</button>
      </div>

      <button id="btn-close-settings" class="menu-btn close-btn">✕ Close</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Loading Screen                                              -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div id="loading-screen">
    <div class="loading-content">
      <div class="c64-boot-text">
        <p>**** FOLDC64 EMULATOR ****</p>
        <p>LOADING SYSTEM...</p>
        <div class="loading-bar">
          <div class="loading-bar-fill" id="loading-progress"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- App Script (ES Module) -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
